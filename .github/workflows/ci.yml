name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o /tmp/actionlint_1.7.7_linux_amd64.tar.gz
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_checksums.txt -o /tmp/checksums.txt
          (cd /tmp && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf /tmp/actionlint_1.7.7_linux_amd64.tar.gz -C /tmp actionlint
          python -m pip install zizmor==1.31.1
      - name: Tests and linters
        run: |
          bash tests/test.sh
          python3 tests/service_test.py
          python3 tests/request_test.py
          shellcheck src/*.sh tests/*.sh
          /tmp/actionlint
          zizmor --offline .
          python3 scripts/check-public.py
  fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./ # zizmor: ignore[self-repository] -- Exercise the checked-out PR action, including unmerged changes.
        id: pick
        with:
          self-hosted: '["self-hosted", "linux"]'
      - name: Check no-token fallback
        env:
          RESULT: ${{ steps.pick.outputs.runs-on }}
          CHOICE: ${{ steps.pick.outputs.choice }}
          REASON: ${{ steps.pick.outputs.reason }}
        run: |
          test "$RESULT" = '["self-hosted","linux"]'
          test "$CHOICE" = self-hosted
          test "$REASON" = 'fallback: decision unavailable'
